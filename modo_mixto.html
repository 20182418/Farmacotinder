<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caso Clínico - FarmacoTinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* ... (Aquí pegas el CSS que diseñamos para la tarjeta de Rocío) ... */
    body {
      margin: 0; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; /* LOS ELEMENTOS SE APILAN VERTICALMENTE */
      justify-content: center; 
      align-items: center;
      background-color: #66e0e5; 
      font-family: 'Segoe UI', sans-serif;
      gap: 20px; /* ESPACIO AUTOMÁTICO ENTRE TARJETA Y BOTÓN */
      padding: 20px;
    }
    /* Logo de fondo sutil */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('Logo_ayudantia.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 550px;
      opacity: 0.15;
      z-index: -1;
    }
    .card-perfil {
        width: 100%;
        min-height: 520px;
        height: auto;
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        margin: 0 auto;
    }

    .card-perfil img {
        width: 180px;
        height: 180px;
        object-fit: contain;
    }
    .info-fármaco{
        padding: 20px;
        text-align: center;
    }
    .info-fármaco h2{
        font-family: 'Monserrat',sans-serif;
        font-weight: 900;
        margin: 0 0 10px 0;
        color: #333;
    }
    .img-contenedor{
        width: 100%;
        background:#f8f9fa ;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .bio-fármaco {
        text-align: justify;
        font-size: 14px;
        line-height: 1.4;
        color: #555;
        background: #f0f7f8;
        padding: 15px;
        border-radius: 15px;
        max-height: 250px; 
        overflow-y: auto; /* Permite scroll interno si el texto es muy largo */
    }
    .btn-back {
      /* Quitamos el margin-bottom para que no empuje hacia arriba innecesariamente */
      background: #333;
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
      margin-top: 10px; /* Refuerzo de separación */
    }

    .btn-back:hover {
      background: #000;
      transform: scale(1.05);
    }
    .main-card { background: #eef9fb; border-radius: 40px; padding: 30px; width: 450px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .speech-bubble { font-family: 'Monserrat',sans-serif;font-weight: 600; background: white; border-radius: 20px; padding: 15px; margin: 20px 0; font-size: 16px; text-align: justify; }
    .btn-farmacotinder { background: #ff5b5b; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 900; cursor: pointer; }
    .bio-fármaco p { margin-bottom: 8px; }
    .bio-fármaco strong { color: #333; }
  </style>
</head>
<body>
  
  <div id="pantalla-caso" class="main-card">
    <div id="titulo-caso" style="font-weight: 900; margin-bottom: 10px;">CASO CLÍNICO</div>
    
    <div class="speech-bubble">
      <p id="texto-descripcion"></p>
    </div>

    <p><strong>¿A quién debería escoger para que la acompañe AHORA?</strong></p>

    <button class="btn-farmacotinder" onclick="irAMatch()">🔥 FARMACOTINDER</button>
  </div>
  <div id="pantalla-tinder" class="main-card" style="display: none; position: relative; min-width: 500px;">
    <div id="contenedor-tarjetas">
        </div>
    
    <div style="display: flex; justify-content: space-around; width: 100%; position: relative; bottom: 5px; left: 0;">
        <button onclick="decidir(false)" style="background:#ff4b2b; border:none; border-radius:50%; width:60px; height:60px; color:white; font-size:30px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">✘</button>
        <button onclick="decidir(true)" style="background:#2ecc71; border:none; border-radius:50%; width:60px; height:60px; color:white; font-size:30px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">❤</button>
    </div>
  </div>
  <a href="index.html" class="btn-back">← VOLVER AL MENÚ</a>
  <script>
    // 1. La Base de Datos
    const baseDeDatosMixta = [
        {
            id:1,
            categoria:"Ansiolíticos",
            descripcion: "Roció de 28 años, estudiante universitaria, con insomnio, ansiedad  y crisis de pánico ocasionales. Está “mentalmente agotada” con palpitaciones nocturnas y dificultad para relajarse. Busca en Farmacotinder a alguien que la pueda acompañar, pero no quiere perder el control; ya que está cerca a rendir una prueba.",
            perfiles: [
                { 
                    nombre: "ValeriaPam (Diazepam)", 
                    bio: "🗒️Soy tranquila y confiable. Me gusta quedarme contigo bastante tiempo y darte paz profunda. (Potenciador GABA)", 
                    atributos:"🌟Me quedo contigo por horas, no te dejo sola tan rápido y te puedo acompañar en tus momentos de crisis",
                    redflag:"🚩No soy buena acompañante si tienes que rendir al 100% al día siguiente",
                    foto: "Diazepam.png",
                    esCorrecto: false 
                },
                { 
                    nombre: "Lore alpra (Alprazolam)", 
                    bio: "🗒️No me gustan los rodeos. Si estás mal, voy directo al punto para hablar lo que te causa tu malestar",
                    atributos:"🌟Estaré contigo de manera rápida cuando te sientas muy ansioso",
                    redflag:"🚩Si te juntas mucho conmigo, luego no te vas a poder separar de mi muy fácil",
                    foto: "Alprazolam.png",
                    esCorrecto: false 
                },
                {
                    nombre:"Clara Lora (Lorazepam)",
                    bio:"🗒️Me gusta el control, la estabilidad y las decisiones pensadas. (Ansiolítico equilibrado)",
                    atributos:" Soy una excelente compañera cuando sientas que tu ansiedad es sostenida",
                    redflag:"Si buscas algo 'fulminante',quizá no soy tu tipo; ya que no soy la más intensa ",
                    foto:"Lorazepam.png",
                    esCorrecto:true
                }
            ]
        },
        {
            id: 2,
            categoria:"Cardiología",
            descripcion: "Varón de 50 años con obesidad y diabetes mellitus de larga data y recientemente diagnosticado con hipertensión arterial. Acude a la app de citas para recibir una terapia adecuada contra su hipertensión. Está iniciando en el veganismo:en el pasado se enfermó por consumir tanta carne. Le gustan los animales pero es alérgico a los gatos, le producen mucha tos.Muy romántico y ama con intensidad y le gustaría engreír a su futura pareja (hipertensión)",
            perfiles: [
                {
                    nombre: "Queca(IECA)", 
                    bio: "🗒️Alma libre, corazón tierno. Amo viajar, el arte, la buena música y las conexiones sinceras. Prima de Sara", 
                    atributos:"🌟Vegana (No riesgo de gota), no odio la carne, pero sí el maltrato animal que conlleva. Deseo un amor que se viva con intensidad y me dé mi lugar.",
                    redflag:"🚩Soy la loca de los gatos: Soy dueña de 15 y 3 màs por adoptar. No tolero princesos que no estén obsesionados conmigo: si eres de esos 50/50 (normotensos) puedes acabar mal (Riesgo hipovolemia).",
                    foto: "IECA.png",
                    esCorrecto: false
                },
                {
                    nombre: "Sara(ARA II)", 
                    bio: "🗒️Dulce, risueña y con buen corazón. Me gustan los pequeños detalles y las buenas conversaciones. Prima de Queca", 
                    atributos:"🌟Crecí en una familia vegetariana, desde chiquita me disgusta la carne. Deseo a un chico que ame con intensidad (hipertensión) que me trate como princesa.",
                    redflag:"🚩Busco intensidad , no medias tintas (normotensión). Si amas con miedo, sigue deslizando. Aquí se viene a sentir fuerte… o no se viene.",
                    foto: "ARAII.png",
                    esCorrecto: false
                },
                {
                    nombre: "Flor Semida(Furosemida)", 
                    bio: "🗒️Me gustan las ideas complejas, el humor raro y la gente que piensa más allá.", 
                    atributos:"🌟Me gusta cuando dos personas se cuidan, se buscan y se eligen sin reservas.",
                    redflag:"🚩 Me gustan las conexiones intensas (hipertensión), las miradas que queman y la gente que sabe lo que quiere. El “vamos viendo” (normotensos) no sobrevive aquí.",
                    foto: "Furosemida.png",
                    esCorrecto: true
                },
                {
                    nombre: "Tíazina (Diurético tiazídico))", 
                    bio: "🗒️Me encantan los planes simples: buena música, comida y conversaciones bonitas.", 
                    atributos:"🌟Amo comer carne.",
                    redflag:"🚩Como muchos pasteles y frituras de la TÍA veneno (hiperglicemia e hiperlipidemia).",
                    foto: "Tiazina.png",
                    esCorrecto: false
                }
              ]
         },
         {
      
            id: 3,
            categoria:"AINEs",
            descripcion: "Paciente: Varón de 58 años, con artrosis severa de rodilla. Síntoma principal: Dolor articular intenso que limita su movilidad. Antecedente clave: Historia de úlcera péptica sangrante hace 3 años. Miedo a reactivarla. Meta: Controlar el dolor y la inflamación sin causar daño gástrico.",
            perfiles: [
                {
                    nombre: "Dina (Diclofenaco)", 
                    bio: "🗒️Soy la chica del barrio, a la que todo el mundo conoce. Si tienes un dolor, yo soy la primera a la que llamas. Soy fuerte, tradicional y no me ando con rodeos.", 
                    atributos:"🌟Resuelvo tus problemas de dolor rápido y sin que tengas que pensarlo dos veces. Soy económica, no te voy a dejar la cartera vacía.",
                    redflag:"🚩Soy un desastre en la cocina, soy conocida por arruinar estómagos. La mayoría de mis comidas son muy ácidas. Soy como soy, no voy a cambiar mi forma de actuar por ti. Si tu estómago es sensible, vamos a tener problemas.",
                    foto: "Diclofenaco.png",
                    esCorrecto: false
                },
                {
                    nombre: "Katy (Ketorolaco)", 
                    bio: "🗒️Soy la adrenalina pura, la emoción fuerte. Cuando el dolor es insoportable, yo soy la única luz en tu oscuridad. Soy intensa, apasionada y te haré olvidar tu sufrimiento... por un rato.", 
                    atributos:"🌟Soy la más fuerte de todas. Cuando las demás fallan, yo te rescato. No te haré esperar, soy tu heroína en una crisis.",
                    redflag:"🚩Literalmente, no puedo prometerte nada a largo plazo. Si insistes en quedarte conmigo, me volveré tóxica. Soy tan intensa que desgasto tu energía vital (tóxico para riñones) y tu cocina (estómago) queda hecha un desastre.",
                    foto: "Ketorolaco.png",
                    esCorrecto: false
                },
                {
                    nombre: "Selena (Celecoxib)", 
                    bio: "🗒️Soy la chica que buscas para algo serio: cuidadosa, atenta y que valora tu bienestar. Mi forma de querer es precisa; escucho tu dolor para aliviarlo justo donde duele, porque para mí, lastimarte jamás es una opción.", 
                    atributos:"🌟Soy exquisitamente selectiva en mi trato, protegiendo siempre tu estómago delicado. Soy confiable y pienso en nuestro futuro, ofreciendo un alivio que perdura. Soy transparente y responsable, priorizando tu salud a largo plazo.",
                    redflag:"🚩Puedo ser un poco costosa de mantener. Antes de un compromiso serio, exijo un chequeo de tu corazón. Mi único defecto molesto es que, en raras ocasiones, puedo provocarte una tos seca persistente.",
                    foto: "Celecoxib.png",
                    esCorrecto: true
        
                }
            ]
        }
    ]

    // 2. Selecciona del Caso (Se ejecuta inmediatamente al cargar el script)
    let indiceCasoAleatorio = Math.floor(Math.random() * baseDeDatosMixta.length);
    let casoActual = baseDeDatosMixta[indiceCasoAleatorio];
    // Variables de control del juego
    let indiceActual = 0;
    let perfilesActuales = casoActual.perfiles;
    
    window.onload=function(){
        if(casoActual){
            document.getElementById('texto-descripcion').innerText = casoActual.descripcion;
            document.getElementById('titulo-caso').innerText = `CASO CLÍNICO: ${casoActual.categoria}`;
        }   
    };
    s
    function irAMatch() {
        document.getElementById('pantalla-caso').style.display = 'none';
        document.getElementById('pantalla-tinder').style.display = 'block';
        mostrarPerfil();
    }

    function mostrarPerfil() {
        const contenedor = document.getElementById('contenedor-tarjetas');
        if (indiceActual >= perfilesActuales.length) {
            contenedor.innerHTML =`
                <div style='padding:20px;'>
                    <h2>¡Se acabaron los candidatos!</h2>
                    <p>¿Lograste ayudar a la paciente?</p>
                    <button class="btn-farmacotinder" onclick="location.reload()">🔄 REINTENTAR (OTRO CASO)</button>
                </div>`;
            return;
        }

        const p = perfilesActuales[indiceActual];
        contenedor.innerHTML = `
            <div class="card-perfil" id="tarjeta">
                <div class="img-contenedor">
                    <img src="${p.foto}" alt="${p.nombre}">
                </div>
                <div class="info-fármaco">
                    <h2>${p.nombre}</h2>
                    <div class="bio-fármaco">
                        <p>${p.bio}</p>
                        <p>${p.atributos}</p>
                        <p>${p.redflag}</p>
                    </div>
                </div>
            </div>
        `;
    }

    function decidir(acepta) {
        const tarjeta = document.getElementById('tarjeta');
        if(!tarjeta) return;

        const esCorrecto = perfilesActuales[indiceActual].esCorrecto;

        if (acepta) {
            tarjeta.style.transform = "translateX(200px) rotate(20deg)";
            tarjeta.style.opacity = "0";
            setTimeout(() => {
                if (esCorrecto) alert("¡Match Perfecto! Es la mejor opción para el caso");
                else alert("Ufff... 😬 No era el indicado para este paciente.");    
            }, 100);
        } else {
            tarjeta.style.transform = "translateX(-200px) rotate(-20deg)";
            tarjeta.style.opacity = "0";
        }

        setTimeout(() => {
            indiceActual++;
            mostrarPerfil();
        }, 500);
    }
  </script>
</body>

</html>
