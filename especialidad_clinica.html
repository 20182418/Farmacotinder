<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FarmacoTinder - Juego</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column; /* Para que el título esté arriba y el contenido abajo */
      justify-content: center;
      align-items: center;
      background-color: rgba(102, 224, 229, 0.85);
      position: relative;
      overflow: hidden;
    }

    /* Mantenemos el logo de fondo con el tamaño que ajustamos */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('Logo_ayudantia.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 300px; /* El tamaño que elegiste */
      opacity: 0.4; 
      z-index: -1;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Aquí diseñaremos las tarjetas de Tinder en el siguiente paso */
    .contenedor-juego {
      z-index: 2;
      text-align: center;
    }

    .btn-volver {
      margin-top: 30px;
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Categoría: [Nombre de la Opción]</h1>

  <div class="contenedor-juego">
      <p>Contenido en desarrollo...</p>
  </div>

  <a href="index2.html" class="btn-volver">← Volver al Menú</a>

</body>
</html>
